name: colorimeter_client
description: >-
  Android BLE client for the Linshang LS170 / LS171 colorimeter: scan, connect,
  measure Lab/Luv/LCh/Yxy/RGB, battery, device info, calibration, ΔE color
  difference, QC and chart matching.
version: 0.1.0
repository: https://github.com/the-coding-aura/colorimeter_client
issue_tracker: https://github.com/the-coding-aura/colorimeter_client/issues
homepage: https://github.com/the-coding-aura/colorimeter_client
topics:
  - bluetooth
  - ble
  - color
  - colorimeter

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.icrpaints.colorimeter_client
        pluginClass: ColorimeterClientPlugin
