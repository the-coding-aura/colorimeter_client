name: colorimeter_client
description: >-
  Android BLE client for Linshang LS170 and LS171 colorimeters: scan, measure,
  calibrate, and compare colors.
version: 0.1.1
repository: https://github.com/the-coding-aura/colorimeter_client
issue_tracker: https://github.com/the-coding-aura/colorimeter_client/issues
homepage: https://github.com/the-coding-aura/colorimeter_client
topics:
  - bluetooth
  - ble
  - color
  - colorimeter

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.icrpaints.colorimeter_client
        pluginClass: ColorimeterClientPlugin
