name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: (cd example && flutter pub get)
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: Analyze
        run: flutter analyze
      - name: Test (package)
        run: flutter test
      - name: Test (example)
        working-directory: example
        run: flutter test
      - name: API docs
        # SDK `dart doc` is dartdoc 9.0.4, which crashes when the Flutter SDK
        # checkout uses CRLF. 9.0.11 is the version verified locally.
        run: |
          dart pub global activate dartdoc 9.0.11
          dart pub global run dartdoc --no-generate-docs
      - name: Publish dry run
        run: |
          set +e
          output=$(flutter pub publish --dry-run 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -ne 65 ]; then exit "$status"; fi
          # The only accepted warning is the missing homepage/repository URL.
          # There is no public remote yet.
          unexpected=$(printf '%s\n' "$output" | grep -E '^[[:space:]]*\* ' | grep -viE 'homepage|repository' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected publish warnings:"
            printf '%s\n' "$unexpected"
            exit 65
          fi
          exit 0

  android:
    runs-on: ubuntu-latest
    needs: dart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example APK (compiles the Kotlin plugin)
        working-directory: example
        run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :colorimeter_client:testDebugUnitTest
